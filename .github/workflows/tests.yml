name: my tests

on:
  pull_request:
  push:

jobs:
  testing_with_pytest_dasha_shramko:
    runs-on: ubuntu-latest
    steps:
      - name: clone repo
        uses: actions/checkout@v7

      - name: hello
        run: echo "welcome"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: run tests!!!
        working-directory: project/app
        env:
          PYTHONPATH: .
        run: uv run --with pytest python -m pytest . -v -s
